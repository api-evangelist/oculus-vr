name: Oculus VR
description: 'Oculus VR is the pioneering virtual reality company founded in 2012 and acquired by Facebook
  (now Meta) in 2014. Its Rift, Go, and Quest headsets defined consumer VR, and the Oculus brand has since
  been folded into Meta Quest and Meta Horizon OS. The former developer.oculus.com and oculus.com properties
  now redirect to Meta''s developer platform. There is no distinct public REST/OpenAPI surface; developers
  build against SDK-based tooling (Unity, Unreal Engine, native OpenXR, and the Meta Spatial SDK) rather
  than a hosted web API. Backed originally by a16z; consumer VR/AR hardware and platform.'
